[mod-name]
WePlayTakenForARide=WePlay: Taken for a Ride — Train Collision Avoidance

[mod-description]
WePlayTakenForARide=Trains pick you up instead of running you over. Get hit by a train and you're scooped into the nearest empty seat and taken along for the ride. If every seat is full, you're bumped safely off the tracks instead.

[mod-setting-name]
wp-tfar-mode=When a train hits you
wp-tfar-message=Show flying text when it happens

[mod-setting-description]
wp-tfar-mode=Pick up: hop into the nearest empty car (falls back to dodging if the train is full).\nDodge: always get bumped safely off the tracks.
wp-tfar-message=Show a little message over your character when a train picks you up or bumps you aside.

[string-mod-setting]
wp-tfar-mode-pickup=Pick me up
wp-tfar-mode-dodge=Bump me aside

[wp-tfar]
picked-up=All aboard!
dodged=Whoa, close one!
